[package]
name = "image-compare"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = "0.31"
egui = "0.31"
log = "0.4"

# Web / WebAssembly target dependencies
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Document",
    "Window",
    "HtmlCanvasElement",
    "HtmlInputElement",
    "ImageBitmap",
    "CanvasRenderingContext2d",
    "ImageData",
    "File",
    "FileList",
    "Blob",
    "BlobPropertyBag",
    "Performance",
    "ClipboardEvent",
    "DataTransfer",
    "DataTransferItem",
    "DataTransferItemList",
    "Event",
] }

# Optimize dependencies (egui, etc.) even in debug/`trunk serve` builds. Without
# this, per-pixel loops such as `ColorImage::from_rgba_unmultiplied` run
# unoptimized and are 10-50x slower, which dominates image load time.
[profile.dev.package."*"]
opt-level = 3

# Light optimization for our own crate keeps debug compiles fast while speeding
# up hot loops (edge detection, pixel processing).
[profile.dev]
opt-level = 1
